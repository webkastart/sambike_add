services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sambike_ads
      POSTGRES_USER: sambike
      POSTGRES_PASSWORD: sambike
    ports:
      - "5432:5432"
    volumes:
      - sambike_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sambike -d sambike_ads"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sambike_postgres_data:
